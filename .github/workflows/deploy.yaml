name: CI/CD Pipeline

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '20.11.1'

      - name: Install dependencies
        run: npm install

      - name: Build React app
        run: npm run build

      - name: Build Docker image
        run: docker build -t garbiasgs .

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          timeout: 10m
          command_timeout: 30m
          script: |
            set -e

            # Load NVM so node and npm are available
            export NVM_DIR="$HOME/.nvm"
            [ -s "$NVM_DIR/nvm.sh" ] && \. "$NVM_DIR/nvm.sh"
            [ -s "$NVM_DIR/bash_completion" ] && \. "$NVM_DIR/bash_completion"

            # Ensure directory exists and navigate
            mkdir -p /var/www/garbiagroup.com/garbiasgs
            cd /var/www/garbiagroup.com/garbiasgs

            # Pull latest changes from GitHub
            git pull origin master

            # Install dependencies and build
            npm install
            npm run build

            # Build Docker image
            docker build -t garbiasgs .

            # Stop and remove old containers
            docker stop garbiasgs-green || true
            docker rm garbiasgs-green || true

            # Run new container
            docker run -d --name garbiasgs-green -p 5174:5173 garbiasgs

            # Reload Nginx
            sudo systemctl reload nginx

            echo "Deployment successful!"