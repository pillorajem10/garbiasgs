name: CI/CD Pipeline

# On push to master: SSH into the VPS, pull the latest code, rebuild the Docker
# image from it, and replace the running container. Building happens once on the
# VPS (measured peak ~900 MB, well within limits) — nothing large is shipped
# over the network, so there's no image tar to transfer.
#
# The SSH step runs up to 3 times. GitHub-hosted runners occasionally hit a
# transient dial timeout reaching an external host (observed once in 16 runs:
# the TCP handshake never completed and nothing reached the VPS's sshd log —
# a network blip between the runner and Hostinger, not a VPS or auth problem).
# A short backoff between attempts is enough for that class of failure to
# clear on its own; a real failure (bad key, VPS down, script error) still
# fails the job after attempt 3, with each attempt's log visible.
#
# `docker build` runs with --no-cache and the build cache is pruned on every
# run. Observed directly on the VPS: the containerd/overlay2 snapshotter
# occasionally fails to commit a RUN layer's filesystem diff (dmesg logged
# "lowerdir is in-use as upperdir/workdir of another mount" at the time),
# so a layer that genuinely succeeded — confirmed by its own build output —
# still isn't there for the next stage's COPY --from=builder to find. Once
# that happens, BuildKit caches the broken result, and every subsequent
# build of that same commit — including all 3 retries above — keeps hitting
# the same broken cache entry forever. Retrying cannot fix a cache miss that
# every attempt reproduces identically; only skipping the cache can. Pruning
# afterward means a future snapshotter fault can't poison a cache entry that
# a later, unrelated deploy would otherwise keep reusing.

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Deploy to VPS (attempt 1 of 3)
        id: attempt1
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.3
        with: &ssh_deploy_params
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          timeout: 60s
          command_timeout: 15m
          script: |
            set -e
            cd /var/www/garbiagroup.com/garbiasgs

            # Pull the latest master exactly (discard any drift on the deploy box).
            git fetch --prune origin master
            git reset --hard origin/master
            echo "Deploying commit: $(git rev-parse --short HEAD)"

            # Rebuild the image from the freshly pulled code. --no-cache: see
            # the file header comment — a stale/corrupted cached layer is a
            # real, observed failure mode here, not a theoretical one.
            docker build --no-cache -t garbiasgs:latest .

            # Replace the running container. Bound to localhost; host nginx
            # reverse-proxies https://garbiagroup.com -> 127.0.0.1:5174.
            docker stop garbiasgs-green 2>/dev/null || true
            docker rm garbiasgs-green 2>/dev/null || true
            docker run -d --name garbiasgs-green --restart always \
              -p 127.0.0.1:5174:5173 garbiasgs:latest

            # Reclaim old dangling images, and the build cache this run just
            # produced but --no-cache means will never be read again anyway.
            docker image prune -f
            docker builder prune -af

            # Smoke test: the container must answer through its published port.
            sleep 2
            curl -sf http://127.0.0.1:5174/ >/dev/null \
              && echo "Deployment successful — container healthy" \
              || (echo "Container did not respond" && exit 1)

      - name: Wait before retry (attempt 1 failed)
        if: steps.attempt1.outcome == 'failure'
        run: |
          echo "Attempt 1 failed to connect or deploy. Retrying in 20s..."
          sleep 20

      - name: Deploy to VPS (attempt 2 of 3)
        id: attempt2
        if: steps.attempt1.outcome == 'failure'
        continue-on-error: true
        uses: appleboy/ssh-action@v1.0.3
        with: *ssh_deploy_params

      - name: Wait before retry (attempt 2 failed)
        if: steps.attempt1.outcome == 'failure' && steps.attempt2.outcome == 'failure'
        run: |
          echo "Attempt 2 failed as well. Retrying in 40s..."
          sleep 40

      - name: Deploy to VPS (attempt 3 of 3, final)
        if: steps.attempt1.outcome == 'failure' && steps.attempt2.outcome == 'failure'
        uses: appleboy/ssh-action@v1.0.3
        with: *ssh_deploy_params
