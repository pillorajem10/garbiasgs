name: CI/CD Pipeline

# Build the Docker image on GitHub's runners (NOT on the VPS), ship it over SSH,
# and replace the running container. The VPS never runs npm or a build.

on:
  push:
    branches:
      - master

env:
  IMAGE: garbiasgs:latest
  CONTAINER: garbiasgs-green
  HOST_PORT: "5174"
  CONTAINER_PORT: "5173"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t "$IMAGE" .

      - name: Save image to compressed tar
        run: docker save "$IMAGE" | gzip > image.tar.gz

      - name: Upload image to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: image.tar.gz
          target: /tmp/garbiasgs
          overwrite: true

      - name: Load image and replace container
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          timeout: 5m
          command_timeout: 10m
          envs: IMAGE,CONTAINER,HOST_PORT,CONTAINER_PORT
          script: |
            set -e

            # Load the freshly built image shipped from CI.
            gunzip -f /tmp/garbiasgs/image.tar.gz
            docker load -i /tmp/garbiasgs/image.tar
            rm -f /tmp/garbiasgs/image.tar

            # Replace the running container with the new image.
            docker stop "$CONTAINER" 2>/dev/null || true
            docker rm "$CONTAINER" 2>/dev/null || true
            docker run -d --name "$CONTAINER" --restart always \
              -p ${HOST_PORT}:${CONTAINER_PORT} "$IMAGE"

            # Reclaim old dangling images so they don't pile up.
            docker image prune -f

            # Smoke test: container should answer through its published port.
            sleep 2
            curl -sf "http://127.0.0.1:${HOST_PORT}/" >/dev/null \
              && echo "Deployment successful — container healthy" \
              || (echo "Container did not respond" && exit 1)
