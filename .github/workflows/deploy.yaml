name: CI/CD Pipeline

# Build the static site on GitHub's runners (NOT on the VPS), then ship the
# pre-built dist/ to the VPS where nginx serves it directly. The VPS never runs
# npm, a build, Docker, or a Node process for this site.

on:
  push:
    branches:
      - master

env:
  # nginx document root on the VPS. Files land here; nginx serves them directly.
  WEB_ROOT: /var/www/garbiagroup.com/html
  # Temporary upload location on the VPS, swapped into WEB_ROOT atomically.
  INCOMING: /var/www/garbiagroup.com/_incoming

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.11.1'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build static site
        run: npm run build

      - name: Upload dist/ to VPS staging dir
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          source: "dist/"
          target: ${{ env.INCOMING }}
          strip_components: 1
          overwrite: true
          rm: true

      - name: Swap into web root and reload nginx
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          timeout: 5m
          command_timeout: 10m
          envs: WEB_ROOT,INCOMING
          script: |
            set -e

            # Keep the previous release for instant rollback.
            rm -rf "${WEB_ROOT}.old"
            if [ -d "$WEB_ROOT" ]; then
              cp -a "$WEB_ROOT" "${WEB_ROOT}.old"
            fi

            # Sync the freshly uploaded build into the web root.
            mkdir -p "$WEB_ROOT"
            rsync -a --delete "$INCOMING/" "$WEB_ROOT/"
            rm -rf "$INCOMING"

            # Validate config, then hot-reload (zero downtime).
            sudo nginx -t
            sudo systemctl reload nginx

            echo "Deployment successful!"
