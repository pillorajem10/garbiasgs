name: CI/CD Pipeline

on:
  push:
    branches:
      - master

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Node.js
        uses: actions/setup-node@v2
        with:
          node-version: '20.11.1'

      - name: Install dependencies
        run: npm install

      - name: Build React app
        run: npm run build

      - name: Build Docker image
        run: docker build -t garbiasgs .

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v0.1.5
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            # Ensure the directory exists
            mkdir -p /var/www/garbiagroup.com/garbiasgs

            # Pull the latest changes from GitHub
            cd /var/www/garbiagroup.com/garbiasgs
            git pull origin master

            # Install dependencies and build on the VPS
            npm install
            npm run build

            # Stop and remove old containers
            docker stop garbiasgs-blue || true
            docker rm garbiasgs-blue || true
            docker stop garbiasgs-green || true
            docker rm garbiasgs-green || true

            # Run the new container
            docker run -d --name garbiasgs-green -p 5174:5173 garbiasgs

            # Reload Nginx to serve the green container
            sudo systemctl reload nginx

            echo "Deployment successful!"