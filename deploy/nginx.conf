# Reference host nginx server block for garbiagroup.com.
#
# The site runs in a Docker container (garbiasgs-green) that serves the static
# build with nginx on container port 5173, published to host port 5174.
# The HOST nginx below terminates SSL and reverse-proxies to that container.
#
# Install into /etc/nginx/sites-available/garbiagroup.com (keep your certbot
# SSL lines), then: sudo nginx -t && sudo systemctl reload nginx

# Redirect all HTTP traffic to HTTPS
server {
    listen 80;
    server_name garbiagroup.com www.garbiagroup.com;
    return 301 https://$host$request_uri;
}

# HTTPS server block — reverse proxy to the container on port 5174
#
# Both hosts are proxied and `proxy_set_header Host $host` preserves which one
# was asked for, so the container redirects www -> non-www itself
# (deploy/docker-nginx.conf). Keep www listed here: it must still terminate TLS
# in order to answer with that redirect rather than a certificate error.
server {
    listen 443 ssl;
    server_name garbiagroup.com www.garbiagroup.com;

    location / {
        proxy_pass http://127.0.0.1:5174;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SSL certificates managed by Certbot
    ssl_certificate /etc/letsencrypt/live/garbiagroup.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/garbiagroup.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
}
