# Reference nginx server block for garbiagroup.com (garbiasgs SPA).
#
# One-time setup on the VPS. This REPLACES the old config that proxied to the
# Node `serve` / Docker container on port 5174. nginx now serves the static
# build directly from disk — no Node process, no Docker, near-zero CPU/RAM.
#
# Install: copy the relevant parts into your existing site file
# (e.g. /etc/nginx/sites-available/garbiagroup.com), keeping YOUR existing
# certbot/SSL lines. Then: sudo nginx -t && sudo systemctl reload nginx
#
# Keep the WEB_ROOT here in sync with .github/workflows/deploy.yaml.

server {
    listen 80;
    server_name garbiagroup.com www.garbiagroup.com;
    # certbot typically manages a redirect to https here — leave it in place.

    root /var/www/garbiagroup.com/html;
    index index.html;

    # SPA fallback: unknown paths return index.html so client-side routing works.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed build assets are immutable — cache them hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # index.html must never be cached, so new deploys are picked up immediately.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json;
    gzip_min_length 1024;
}
