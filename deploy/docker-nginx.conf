# nginx config baked into the container image. Listens on 5173 (the port the
# host nginx proxies to via -p 5174:5173). Serves the static SPA build.
#
# The host nginx passes the visitor's Host header through (proxy_set_header
# Host $host), so canonical-host handling belongs here and ships with the image.
server {
    listen 5173;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # --- Canonical host -----------------------------------------------------
    # www.garbiagroup.com and garbiagroup.com both resolved to this container
    # and both answered 200 with identical content, so search engines saw two
    # copies of every page. Non-www is the host named by every canonical tag,
    # the sitemap, and the structured data, so www permanently redirects to it.
    # Scheme is hard-coded: the site is HTTPS-only and the host nginx terminates
    # TLS, so $scheme here is always "http" and would downgrade the redirect.
    if ($host = www.garbiagroup.com) {
        return 301 https://garbiagroup.com$request_uri;
    }

    # --- Canonical path -----------------------------------------------------
    # /services/ and /services served the same page. Redirect to the no-trailing
    # -slash form that the canonical tags and sitemap use. The root "/" keeps
    # its slash.
    rewrite ^/(.+)/$ /$1 permanent;

    # --- Routing ------------------------------------------------------------
    # The build prerenders one HTML file per route (scripts/prerender.mjs), so
    # /services is served from /services.html — a real document with that
    # page's title, description, canonical, and content, rather than the SPA
    # shell. Anything with no matching file is genuinely missing and gets a 404
    # status; answering those with 200 + the shell is what Search Console
    # reports as a soft 404.
    #
    # The root is matched exactly and mapped straight to index.html. It cannot
    # go through the try_files below: $uri is "/" there, and a try_files entry
    # ending in a slash tests for a *directory* — the document root always
    # exists, so nginx would internally redirect "/" to "/" and fail the request
    # with a rewrite-cycle error.
    location = / {
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri.html =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
        add_header Cache-Control "no-cache";
    }

    # Hashed build assets are immutable — cache hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # Prerendered HTML must never be cached, so a deploy is picked up at once.
    location ~* \.html$ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Crawler-facing files change with each deploy; keep them fresh but cheap.
    location = /robots.txt {
        add_header Cache-Control "public, max-age=3600";
    }
    location = /sitemap.xml {
        add_header Cache-Control "public, max-age=3600";
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml application/json text/xml application/xml text/plain;
    gzip_min_length 1024;
}
